version: '3.8'

services:
  resume-matcher:
    build: .
    ports:
      - "5009:5009"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5009/"]
      interval: 30s
      timeout: 10s
      retries: 3